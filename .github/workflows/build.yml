name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build QuickTab.app
        run: ./scripts/build-app.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent QuickTab.app QuickTab.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QuickTab
          path: build/QuickTab.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/QuickTab.zip
